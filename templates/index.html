<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv11 Object Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0f0;
        }
        
        .upload-section.dragover {
            border-color: #764ba2;
            background: #e8e8e8;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .preview-section {
            display: none;
            margin-top: 30px;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .image-preview {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .image-container {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }
        
        .image-container h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
        }
        
        .image-container img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .detections-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .detection-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 YOLOv11 Object Detection</h1>
            <p>Upload an image to detect objects using advanced AI</p>
        </div>
        
        <div class="content">
            <div class="upload-section" id="uploadSection">
                <h2 style="margin-bottom: 20px; color: #333;">📤 Upload Your Image</h2>
                <p style="margin-bottom: 30px; color: #666;">Drag and drop or click to select</p>
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" accept="image/*">
                    <label for="imageInput" class="file-input-label">Choose Image</label>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="font-size: 1.2em; color: #667eea;">Processing your image...</p>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="preview-section" id="previewSection">
                <div class="image-preview">
                    <div class="image-container">
                        <h3>Original Image</h3>
                        <img id="originalImage" alt="Original">
                    </div>
                    <div class="image-container">
                        <h3>Detected Objects</h3>
                        <img id="detectedImage" alt="Detected">
                    </div>
                </div>
                
                <div class="detections-info">
                    <h3 style="margin-bottom: 15px;">Detection Results</h3>
                    <div id="detectionsList"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadSection = document.getElementById('uploadSection');
        const imageInput = document.getElementById('imageInput');
        const loading = document.getElementById('loading');
        const previewSection = document.getElementById('previewSection');
        const originalImage = document.getElementById('originalImage');
        const detectedImage = document.getElementById('detectedImage');
        const detectionsList = document.getElementById('detectionsList');
        const errorDiv = document.getElementById('error');
        
        // Drag and drop handlers
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleImage(files[0]);
            }
        });
        
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImage(e.target.files[0]);
            }
        });
        
        async function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please upload a valid image file');
                return;
            }
            
            // Show loading
            loading.classList.add('active');
            previewSection.classList.remove('active');
            errorDiv.classList.remove('active');
            
            // Show original image
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
            
            try {
                // Create form data
                const formData = new FormData();
                formData.append('image', file);
                
                // Send to API
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to process image');
                }
                
                // Show results
                detectedImage.src = data.annotated_image;
                displayDetections(data.detections);
                
                loading.classList.remove('active');
                previewSection.classList.add('active');
                
            } catch (error) {
                loading.classList.remove('active');
                showError(error.message);
            }
        }
        
        function displayDetections(detections) {
            if (detections.length === 0) {
                detectionsList.innerHTML = '<p style="color: #666;">No objects detected</p>';
                return;
            }
            
            let html = `<p style="margin-bottom: 15px; font-weight: 600; color: #333;">Total: ${detections.length} object(s) detected</p>`;
            
            detections.forEach((detection, index) => {
                html += `
                    <div class="detection-item">
                        <strong>Object ${index + 1}:</strong> Class ${detection.class} 
                        <span style="float: right; color: #667eea; font-weight: 600;">
                            ${(detection.confidence * 100).toFixed(1)}% confidence
                        </span>
                    </div>
                `;
            });
            
            detectionsList.innerHTML = html;
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }
    </script>
</body>
</html>
